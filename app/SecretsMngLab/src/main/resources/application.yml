server:
  port: 8080

spring:
  application:
    name: SecretsMngLab
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  internal-token:
    token: ${INTERNAL_TOKEN:}
  jwt:
    secret: ${APP_JWT_SECRET:}
  api:
    key: ${APP_API_KEY:}
  private-key:
    path: ${APP_PRIVATE_KEY_PATH:}