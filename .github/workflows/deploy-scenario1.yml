name: Deploy Scenario 1

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JAR
        run: |
          cd app/SecretsMngLab
          ./gradlew clean bootJar --no-daemon

      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy-bundle
          cp app/SecretsMngLab/build/libs/*.jar deploy-bundle/app.jar
          cp app/SecretsMngLab/Dockerfile.runtime deploy-bundle/Dockerfile.runtime
          cp infra/docker/docker-compose.scenarijs1.yml deploy-bundle/docker-compose.scenarijs1.yml
          cp infra/scripts/deploy-scenario1.sh deploy-bundle/deploy-scenario1.sh

      - name: Copy deployment bundle to apphost
        run: |
          scp -o StrictHostKeyChecking=no deploy-bundle/* vagrant@192.168.56.12:/opt/secret-thesis/deploy/scenario1/

      - name: Execute deployment on apphost
        run: |
          ssh -o StrictHostKeyChecking=no vagrant@192.168.56.12 "chmod +x /opt/secret-thesis/deploy/scenario1/deploy-scenario1.sh && /opt/secret-thesis/deploy/scenario1/deploy-scenario1.sh"