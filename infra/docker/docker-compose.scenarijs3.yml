services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: secretlab
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d secretlab"]
      interval: 10s
      timeout: 5s
      retries: 10

  infisical:
    image: infisical/infisical:latest-postgres
    ports:
      - "8083:8080"
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      SITE_URL: ${INFISICAL_SITE_URL}
      DB_CONNECTION_URI: ${INFISICAL_DB_CONNECTION_URI}

  app:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    depends_on:
      postgres:
        condition: service_healthy
      infisical:
        condition: service_started
    ports:
      - "8082:8080"
    environment:
      INFISICAL_API_URL: http://infisical:8080
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_ENV: ${INFISICAL_ENV}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

volumes:
  postgres_data: