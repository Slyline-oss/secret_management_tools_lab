services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: secretlab
      POSTGRES_USER: vault_admin
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_admin -d secretlab"]
      interval: 10s
      timeout: 5s
      retries: 10

  vault:
    image: hashicorp/vault:1.18
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev

  app:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_DB_ROLE: secretlab-app-role
      VAULT_STATIC_SECRET_PATH: secret/secretlab/app
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

volumes:
  postgres_data: