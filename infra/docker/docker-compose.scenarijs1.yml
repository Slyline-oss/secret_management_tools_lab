services:
  postgres:
    image: postgres:16
    container_name: secretlab-postgres
    environment:
      POSTGRES_DB: 
      POSTGRES_USER:
      POSTGRES_PASSWORD: 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretlab_user -d secretlab"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.75

  app:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    container_name: secretlab-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/secretlab
      SPRING_DATASOURCE_USERNAME:
      SPRING_DATASOURCE_PASSWORD: 
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    mem_limit: 768m
    cpus: 1.0

volumes:
  postgres_data: